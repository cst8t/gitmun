# Backend used for Git operations.
# "Default" tries the preferred backend first, then falls back when needed.
# "GitCliOnly" always uses the system Git CLI.
backendMode = "Default"

# Whether to show the result log by default at launch
showResultLog = false

# UI theme mode.
# "System" follows the operating system preference.
# "Light" uses the light theme.
# "Dark" uses the dark theme.
# Edit themes/light.toml and themes/dark.toml in the config folder to customise colours.
themeMode = "System"

# UI text scale.
# Supported values: 0.9, 1.0, 1.1, 1.2, 1.3.
uiTextScale = 1.0

# Whether to wrap long lines in diff views.
wrapDiffLines = false

# Experimental: show the commit graph toolbar button.
showCommitGraphButton = false

# Experimental: enable Local Copy in the Clone window and CLI.
enableLocalCopy = false

# Whether error messages stay open until dismissed.
persistentErrorToasts = false

# Error message auto-close delay in milliseconds when errors are not kept open.
# Minimum: 1000.
errorToastClearDelayMs = 8000

# Width of the left pane in pixels.
leftPaneWidth = 300

# Width of the right pane in pixels.
rightPaneWidth = 420

# Whether to show a confirmation dialogue before reverting changes.
confirmRevert = true

# Avatar provider for commit authors.
# "Off" disables author avatars.
# "Libravatar" fetches avatars from the Libravatar service.
avatarProvider = "Libravatar"

# Whether to try the platform-specific avatar source (GitHub) before Libravatar.
tryPlatformFirst = true

# Default directory for cloning repositories. Leave empty to use the system default.
defaultCloneDir = ""

# Which date to show in the commit log.
# "AuthorDate" shows the date the commit was authored.
# "CommitterDate" shows the date the commit was committed.
commitDateMode = "AuthorDate"

# Primary action for the commit button.
# "commit" commits staged changes.
# "commitAndPush" commits and then pushes in one step.
commitPrimaryAction = "commit"

# Recommended maximum length for the first line of a commit message.
# Set to 0 to disable the length check.
commitMessageRecommendedLength = 72

# Whether to automatically push tags when pushing commits.
pushFollowTags = false

# Fetch remotes periodically while a repository window is focused.
# Use 0 to disable, or 5, 10, 30, or 60 minutes.
autoFetchIntervalMinutes = 0

# Whether to check for application updates on launch.
autoCheckForUpdatesOnLaunch = true

# Whether to automatically install updates when available.
autoInstallUpdates = false

# URL for checking application updates.
updateEndpoint = "https://github.com/cst8t/gitmun/releases/latest/download/latest.json"

# Graphics mode for Linux. Takes effect on the next launch.
# "Auto" applies workarounds only when needed (recommended for most systems).
# "Safe" forces X11 and software rendering for compatibility.
# "Native" applies no overrides; uses full hardware acceleration.
linuxGraphicsMode = "Auto"

# Terminal emulator for Linux repository opens.
# Use "auto", "custom", or a known terminal ID such as "ghostty" or "gnome-terminal".
linuxTerminalEmulator = "auto"

# Custom Linux terminal command. Used only when linuxTerminalEmulator is "custom".
# Use {path} where the repository path should be inserted.
linuxTerminalCustomCommand = ""

# Behaviour when opening a repository.
# "Ask" prompts for which window to use.
# "ExistingWindow" opens the repository in the current window.
# "NewWindow" opens the repository in a new window.
repoOpenBehaviour = "Ask"

# Optional Git executable path. Leave blank to use Gitmun's automatic lookup.
gitExecutablePath = ""

# Whether Gitmun may fetch missing GPG public keys through your GnuPG keyserver configuration.
gpgKeyserverVerificationEnabled = false

# Bundled experimental AI extension. New installations start with it disabled.
[extensions.ai]
enabled = false
selectedProfileId = ""
profiles = []

# Maximum context sent in each AI commit-message request, in KiB.
# Larger staged diffs use bounded chunks and summaries, up to 1024 KiB total.
# Values are limited to the range 8-1024.
commitContextLimitKib = 24

# Maximum conflict context sent for AI conflict resolution, in KiB.
# Values are limited to the range 8-1024.
conflictContextLimitKib = 48

# Maximum provider output for AI commit messages, in tokens.
# Values are limited to the range 1-65536.
commitMessageMaxTokens = 512

# Maximum provider output for AI conflict resolution, in tokens.
# Values are limited to the range 1-65536.
conflictResolutionMaxTokens = 4096

# Instructions used to generate commit messages. Gitmun adds the active subject limit separately.
commitMessagePrompt = "Write a concise Git commit message in the style of the supplied recent commits. Return only the commit message as plain text. Put the subject first, then an optional blank line and body. Summarise the staged changes accurately. Do not use Markdown headings, lists, fences, emoji, or commentary."

# Instructions used to resolve conflicts. Gitmun keeps the structured response schema fixed.
conflictResolutionPrompt = "Resolve the supplied Git conflict regions. Preserve intended behaviour and surrounding style. Return only the requested structured JSON with one replacement for every supplied region ID."

# Include recent commit messages when generating commit-message suggestions.
includeCommitHistory = true

# Repository-relative glob patterns that are never included in AI context.
globalExclusions = []

# Provider destinations approved after Gitmun shows its first-use privacy notice.
consentedDestinations = []

# Per-repository AI policies are added here after they are configured in Gitmun.
repositoryPolicies = {}
